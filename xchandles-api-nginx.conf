# XCHandles listener API - example Nginx site (mainnet).
#
# Drop in /etc/nginx/sites-available/ and enable it. Application ports stay
# private; this process is the public TLS boundary.
#
# This is a LIVE chain-index API (updates every Chia block). It is NOT
# immutable like nfts /v1/ media. The app does not emit Cache-Control today,
# so nginx proxy_cache_valid is the TTL. Cache is short and route-specific.
#
# Public CORS (axum CorsLayer on GET/HEAD/OPTIONS): any origin, no credentials.
# ACAO is *; CorsLayer's default Vary would otherwise store one copy per Origin
# - proxy_ignore_headers Vary on cached locations, same as nfts.
#
# Also add these to the http { } block (nginx.conf / conf.d):
#
#   limit_req_zone $binary_remote_addr zone=xchandles_api_reads:10m rate=300r/m;
#   proxy_cache_path /var/cache/nginx/xchandles-api levels=1:2 keys_zone=xchandles_api:10m max_size=256m inactive=2d use_temp_path=off;
#
# `limit_req_status 429;` is http-global and may already be set by another
# XCHandles site (e.g. nfts). Do not add it a second time.
#
# Cache key is method + server_name + path ($uri) + known query args only
# (launcher_id, include_metadata, view, cursor, limit, bypass_expiration_safety_check),
# space-delimited so adjacent empty $arg_* cannot glue distinct URIs together.
# Junk query strings and Host header variation must not fragment the cache.
# Never cache 400/401/403/404/410/429/500/502/503/504 - 503 is index_stale
# (and singleton/resolution incomplete/mismatch); 410 is handle_expired.
#
# For testnet, copy this file and change server_name + certificate paths to
# testnet-api.xchandles.com.

upstream xchandles_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.xchandles.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.xchandles.com;

    ssl_certificate     /etc/letsencrypt/live/api.xchandles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.xchandles.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    server_tokens off;
    client_max_body_size 32k;
    absolute_redirect off;

    # JSON envelope instead of Nginx HTML. request_id is the static marker
    # "nginx" - the app mints UUID v4 ids for its own errors.
    error_page 404 = @json_404;
    error_page 413 = @json_413;
    error_page 429 = @json_429;
    error_page 502 504 = @json_502;

    # Canonical cache key: path + serde-relevant args, space-delimited so
    # adjacent empty $arg_* cannot glue distinct URIs together. Empty $arg_*
    # is fine - missing params share a key. Mixed-case /singletons hex is not
    # cached (regex below is lowercase-only; prefix location has cache off).
    # Uncached locations inherit this key but never look it up.
    proxy_cache_key "$request_method $server_name $uri $arg_launcher_id $arg_include_metadata $arg_view $arg_cursor $arg_limit $arg_bypass_expiration_safety_check";

    location = /healthz {
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Legacy liveness from listen.rs neighbors router (StatusCode::OK). Same
    # as /healthz: never cache a probe, keep it out of the access log.
    location = / {
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location ~ /\. {
        deny all;
    }

    # Newest-first registration feed. Kept off /registrations/{handle} so the
    # canonical handle "recent" can be registered and looked up. Cache 5s - a
    # new register/expire lands every spent registry coin.
    location = /recent-registrations {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    # Auction clock: premiums decay with projected_pricing_timestamp, and
    # view=active|soon / cursor / limit / launcher_id all change the page.
    # 5s is long enough to collapse identical wallet polls, short enough
    # that a ticking premium is not served stale for a full block.
    location = /expiring {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    # Live committed base + remaining unrolls. Same 5s as /expiring: quotes
    # change when a generation is unrolled or a new peak confirms.
    location = /price {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 5s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    # Static Price Singleton generation list. Last row holds; cache 1d.
    # Shared zone inactive is 2d so a cold /schedule is not evicted at 2m.
    location = /schedule {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    # Legacy spend-critical CLI (launcher_id + handle_hash). Neighbor slots
    # and parent proofs must not be served from a cache that can lag a spend.
    # Rate-limit only; OPTIONS still reaches CorsLayer.
    location = /neighbors {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Pending transfer: 200 JSON when performable, 204 when not. Cache both -
    # a 204 is as hot as a 200 for wallets polling "can I execute?". 5s; the
    # executor coin can change on the next spend. This regex is listed before
    # /handle/{handle} so the static /pending-transfer suffix wins.
    location ~ "^/handle/([a-z0-9]{3,63})/pending-transfer$" {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 204 5s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    # HOT path: wallet/UI handle resolution. Canonical grammar only
    # (is_canonical_handle: 3-63 lowercase alphanumeric, no normalization).
    # Embeds pending_transfer (null or the /pending-transfer 200 body).
    # ~15s with cache lock so a popular handle does not stampede the indexer
    # on expiry. Query string is part of the key (launcher_id, include_metadata,
    # bypass_expiration_safety_check). 410/503 must not stick in cache.
    location ~ "^/handle/([a-z0-9]{3,63})$" {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_lock on;
        proxy_cache_valid 200 15s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    # Invalid handle names (uppercase, too short/long, punctuation) still
    # reach the app for its 400 invalid_handle envelope. Do not cache them
    # as success - they are never 200.
    location /handle/ {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Historical registration fact (secret, fee, height). Still chain-dependent
    # (expire/register can replace the row) but colder than live resolution -
    # 30s. The handle "recent" is a normal lookup here.
    location ~ "^/registrations/([a-z0-9]{3,63})$" {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    location /registrations/ {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live singleton state (coin, inner puzzle, optional NFT metadata).
    # include_metadata must be in the cache key. 10s - follows every peak.
    # launcher_id is 64 lowercase hex, optional 0x (parse_launcher_id).
    # Mixed-case hex falls through to location /singletons/ (cache off).
    location ~ "^/singletons/(0x)?[0-9a-f]{64}$" {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_cache xchandles_api;
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 10s;
        proxy_cache_valid 400 401 403 404 410 429 500 502 503 504 0;
    }

    location /singletons/ {
        limit_req zone=xchandles_api_reads burst=30 nodelay;
        proxy_cache off;
        proxy_pass http://xchandles_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }

    location @json_404 {
        default_type application/json;
        return 404 '{"code":"not_found","message":"Not found.","request_id":"nginx"}';
    }

    location @json_413 {
        default_type application/json;
        return 413 '{"code":"payload_too_large","message":"Request body exceeds the 32 KiB limit.","request_id":"nginx"}';
    }

    location @json_429 {
        default_type application/json;
        return 429 '{"code":"rate_limited","message":"Too many requests.","request_id":"nginx"}';
    }

    location @json_502 {
        default_type application/json;
        return 502 '{"code":"bad_gateway","message":"Upstream unavailable.","request_id":"nginx"}';
    }
}
